
name: Build Swiftfin tvOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Swiftfin for Apple TV
    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"
      SCHEME: "Swiftfin tvOS"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      - name: Build tvOS
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: |
            bundle exec fastlane buildLane \
              scheme:"\"${{ env.SCHEME }}\"" \
              xcodeVersion:${{ env.XCODE_VERSION }}

      - name: Package unsigned IPA
        env:
          SCHEME: ${{ env.SCHEME }}
        run: |
          set -euo pipefail

          mkdir -p fastlane/build/Payload

          cp -R fastlane/build/*.xcarchive/Products/Applications/*.app \
            fastlane/build/Payload/

          cd fastlane/build

          zip -r -y "$SCHEME-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: Swiftfin-tvOS-unsigned
          path: fastlane/build/*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
